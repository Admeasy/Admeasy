name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "18"
  DEPLOY_PATH: /var/www/admeasy/Admeasy
  PM2_APP_NAME: admeasy-backend

jobs:
  build-and-validate:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ---------------------------
      # Client
      # ---------------------------
      - name: Install Client dependencies
        working-directory: ./Client
        run: |
          npm ci --legacy-peer-deps
          npm install --no-save \
            @rollup/rollup-linux-x64-gnu \
            lightningcss-linux-x64-gnu \
            --legacy-peer-deps

      - name: Build Client
        working-directory: ./Client
        env:
          NODE_ENV: production
        run: npm run build

      - name: Validate Client build output
        run: |
          if [ ! -d Client/dist ]; then
            echo "::error::Client/dist not found. React build did not produce output."
            exit 1
          fi
          echo "Client/dist exists ($(find Client/dist -type f | wc -l) files)"

      - name: Upload Client build
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: Client/dist
          retention-days: 1

      # ---------------------------
      # Server
      # ---------------------------
      - name: Install Server dependencies
        working-directory: ./Server
        run: npm ci

      - name: Validate Server syntax
        working-directory: ./Server
        run: |
          node -c index.js
          npm ls --omit=dev --no-audit --no-fund

      - name: Check for broken relative imports (Linux-safe)
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const exts = ['.js', '.json'];
          let failed = false;

          function existsCaseSensitive(targetPath) {
            const parts = path.resolve(targetPath).split(path.sep).filter(Boolean);
            let current = path.isAbsolute(targetPath) ? path.sep : '';
            for (const part of parts) {
              const dir = current || path.sep;
              try {
                const entries = fs.readdirSync(dir);
                if (!entries.includes(part)) return false;
              } catch {
                return false;
              }
              current = path.join(current, part);
            }
            return true;
          }

          function resolveImport(baseDir, importPath) {
            const full = path.resolve(baseDir, importPath);
            const candidates = [
              full,
              ...exts.map(ext => full + ext),
              ...exts.map(ext => path.join(full, 'index' + ext)),
            ];
            return candidates.find(p => fs.existsSync(p) && existsCaseSensitive(p));
          }

          function walk(dir) {
            for (const file of fs.readdirSync(dir)) {
              const full = path.join(dir, file);
              const stat = fs.statSync(full);

              if (stat.isDirectory()) {
                if (['node_modules', '.git', 'dist'].includes(file)) continue;
                walk(full);
              } else if (file.endsWith('.js')) {
                const content = fs.readFileSync(full, 'utf8');

                const regexes = [
                  /require\(['"`](\.{1,2}\/[^'"`]+)['"`]\)/g,
                  /from ['"`](\.{1,2}\/[^'"`]+)['"`]/g,
                  /import\(['"`](\.{1,2}\/[^'"`]+)['"`]\)/g
                ];

                for (const regex of regexes) {
                  let match;
                  while ((match = regex.exec(content)) !== null) {
                    const rel = match[1];
                    const resolved = resolveImport(path.dirname(full), rel);
                    if (!resolved) {
                      console.error(`❌ Broken import in ${full} → ${rel}`);
                      failed = true;
                    }
                  }
                }
              }
            }
          }

          walk('./Server');

          if (failed) process.exit(1);
          else console.log('✅ Imports OK');
          EOF

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-validate
    if: success() && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Client build
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client-dist

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Backup .env
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
          ssh $SSH_OPTS "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "
            mkdir -p ${DEPLOY_PATH}/backup
            [ -f ${DEPLOY_PATH}/Server/.env ] && cp ${DEPLOY_PATH}/Server/.env ${DEPLOY_PATH}/backup/.env.backup || true
          "

      - name: Deploy (rsync + PM2)
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"

          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'Client' \
            --exclude 'dist' \
            --exclude '*.log' \
            --exclude '.env' \
            --exclude 'uploads' \
            -e "ssh $SSH_OPTS" \
            Server/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${DEPLOY_PATH}/Server/"

          rsync -avz --delete \
            -e "ssh $SSH_OPTS" \
            client-dist/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${DEPLOY_PATH}/Server/dist/"

          ssh $SSH_OPTS "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "
            set -e
            cd ${DEPLOY_PATH}/Server

            if [ ! -f .env ] && [ -f ${DEPLOY_PATH}/backup/.env.backup ]; then
              cp ${DEPLOY_PATH}/backup/.env.backup .env
            fi

            npm ci --omit=dev || npm install --omit=dev

            # 🔥 FIX: Run backend + worker
            pm2 delete all || true
            pm2 start ecosystem.config.js

            pm2 save
            echo '🚀 Deployment complete with worker'
          "