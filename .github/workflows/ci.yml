# Production CI/CD: Build → Validate → Deploy to VPS (PM2)
# Repo: Client (Vite/React) + Server (Node/Express)
# Required secrets: VPS_HOST, VPS_USER, SSH_PRIVATE_KEY
# Optional: PM2_APP_NAME (default: admeasy-server), DEPLOY_PATH (default: ~/SiteAdmeasy)

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "18"

jobs:
  build-and-validate:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            Client/package-lock.json
            Server/package-lock.json

      # --- Client ---
      - name: Cache Client node_modules
        uses: actions/cache@v4
        id: client-cache
        with:
          path: Client/node_modules
          key: client-${{ runner.os }}-node-${{ hashFiles('Client/package-lock.json') }}
          restore-keys: |
            client-${{ runner.os }}-node-

      - name: Install Client dependencies
        working-directory: Client
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Build Client
        working-directory: Client
        run: npm run build

      - name: Upload Client build
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: Client/dist
          retention-days: 1

      # --- Server ---
      - name: Cache Server node_modules
        uses: actions/cache@v4
        id: server-cache
        with:
          path: Server/node_modules
          key: server-${{ runner.os }}-node-${{ hashFiles('Server/package-lock.json') }}
          restore-keys: |
            server-${{ runner.os }}-node-

      - name: Install Server dependencies
        working-directory: Server
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Validate Server (dependencies & syntax)
        working-directory: Server
        run: |
          node -c index.js
          npm ls --omit=dev --no-audit --no-fund

      - name: Validate Client build output
        run: |
          if [ ! -d Client/dist ]; then echo "::error::Client/dist not found. React build did not produce output."; exit 1; fi
          echo "Client/dist exists ($(find Client/dist -type f | wc -l) files)"

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-validate
    if: success() && github.ref == 'refs/heads/main'

    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/SiteAdmeasy' }}
      PM2_APP_NAME: ${{ secrets.PM2_APP_NAME || 'admeasy-server' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Client build
        uses: actions/download-artifact@v4
        with:
          name: client-dist

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to VPS (rsync + PM2)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
          # Sync server source (exclude node_modules and dist; we upload dist separately)
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude 'Client' \
            --exclude 'dist' \
            --exclude '*.log' \
            -e "ssh $SSH_OPTS" \
            Server/ "$VPS_USER@$VPS_HOST:${DEPLOY_PATH}/Server/"

          # Sync built client into Server/dist (served by Express)
          rsync -avz --delete \
            -e "ssh $SSH_OPTS" \
            client-dist/ "$VPS_USER@$VPS_HOST:${DEPLOY_PATH}/Server/dist/"

          # On VPS: install production deps and restart PM2
          ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "set -e; cd ${DEPLOY_PATH}/Server && export NODE_ENV=production && (npm ci --omit=dev --no-audit --no-fund 2>/dev/null || npm install --omit=dev --no-audit --no-fund) && (pm2 restart $PM2_APP_NAME --update-env || pm2 start index.js --name $PM2_APP_NAME)"
